name: Clean image in Docker

on:
  push:
    branches:
      - "clean-job-*"
    paths:
      - "jobs/READY"

permissions:
  contents: write

env:
  IMAGE_NAME: ghcr.io/jgreencolon-sketch/remove-ai-marks-service:latest

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out job branch
        uses: actions/checkout@v4

      - name: Assemble input image
        run: |
          mkdir -p work result
          cat jobs/input.part.* | base64 --decode > work/input.png

      - name: Pull and start cleaner
        run: |
          docker pull "${IMAGE_NAME}"
          docker run --detach --name remove-ai-marks --publish 8765:8765 "${IMAGE_NAME}"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs remove-ai-marks
          exit 1

      - name: Inspect and clean through Docker API
        run: |
          python tools/clean_job.py \
            work/input.png \
            result/image.cleaned.png \
            result/cleaning-report.json

      - name: Upload cleaned image and report
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-image-${{ github.run_id }}
          path: result/
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary job branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_BRANCH: ${{ github.ref_name }}
        run: |
          curl --fail --silent --show-error \
            --request DELETE \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${JOB_BRANCH}"
